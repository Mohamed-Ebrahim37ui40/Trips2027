<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدول الرحلات والحضور</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f4c5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الرحلات">
<style>
:root{color-scheme:light dark;--bg:#f2f5f7;--card:#fff;--ink:#17222d;--mut:#5d6b78;--line:#dde4ea;--work:#d9f2ea;--workink:#0b5d49;--mis:#1d4ed8;--rest:#fde9b8;--restink:#7a4a05;--acc:#0f4c5c;--accink:#fff;--na:#e8ecef;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e8eef3;--mut:#9aa9b6;--line:#2a3743;--work:#123b32;--workink:#8fe0c8;--mis:#6c9bff;--rest:#4a3510;--restink:#f6cf86;--acc:#5fb4c9;--accink:#08222b;--na:#222d37;--bad:#ff8a80}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:16px;line-height:1.5;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.wrap{max-width:780px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 10px}
h1{font-size:1.25rem}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
button,input,select{font:inherit;color:inherit}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.nav .chip{border-radius:10px;padding:8px 14px}
.sm .chip{padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--accink);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.o{background:transparent;color:var(--acc)}.btn.d{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
h2{font-size:1.08rem;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:10px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:1.9rem;line-height:1.1}.stat span{font-size:.85rem}
.s-rest{background:var(--rest);color:var(--restink)}.s-work{background:var(--work);color:var(--workink)}.s-mis{background:var(--mis);color:#fff}
.sum,.small{color:var(--mut);font-size:.88rem}.sum{margin-top:10px}
.item{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.tag{font-size:.78rem;font-weight:700;border-radius:8px;padding:2px 9px;white-space:nowrap}
.t-dep{background:var(--work);color:var(--workink)}.t-ret{background:var(--rest);color:var(--restink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{text-align:center;border-radius:8px;padding:7px 0;font-size:.92rem}
.cal .h{font-size:.72rem;color:var(--mut);padding:2px 0}
.c-work{background:var(--work);color:var(--workink)}.c-rest{background:var(--rest);color:var(--restink)}.c-mis{background:var(--mis);color:#fff;font-weight:700}.c-na{background:var(--na);color:var(--mut)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:.82rem;color:var(--mut)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tfoot td{font-weight:800;border-bottom:0}
.badge{display:inline-block;border-radius:10px;padding:1px 9px;color:#fff;font-weight:700;font-size:.82rem}
.b1{background:#c62828}.b2{background:#c25b00}.b3{background:#2e7d32}
tr.now td{background:var(--work)}
.f{display:grid;gap:10px;grid-template-columns:1fr 1fr}.f label{display:grid;gap:4px;font-size:.88rem;color:var(--mut)}.f .w{grid-column:1/-1}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bad{color:var(--bad);font-weight:700}
dialog{margin:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:16px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
#toast{position:fixed;inset-inline:0;bottom:max(16px,env(safe-area-inset-bottom));text-align:center;pointer-events:none}
#toast span{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:.9rem;display:inline-block}
details{margin-top:8px;color:var(--mut);font-size:.88rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>جدول الرحلات والحضور</h1><button class="btn o" id="inst" hidden>تثبيت التطبيق</button></div>
  <div class="row" id="trips" role="group" aria-label="رقم الرحلة"></div>
  <div class="row nav" id="nav"></div>
  <div id="out"></div>
</div>
<dialog id="dlg"><h2 id="dt"></h2>
  <div class="f"><label class="w">رقم الرحلة<select id="et"><option>1</option><option>2</option><option>3</option></select></label>
  <label>تاريخ الذهاب<input type="date" id="ed"></label><label>تاريخ العودة<input type="date" id="er"></label></div>
  <p class="bad small" id="eerr"></p>
  <div class="acts"><button class="btn" id="esave">حفظ</button><button class="btn o" id="ecancel">إلغاء</button><button class="btn d" id="edel">حذف</button></div>
</dialog>
<div id="toast"></div>
<input type="file" id="imp" accept="application/json" hidden>
<script>
const BASE=[[1,"05/10/2026","24/10/2026"],[2,"14/10/2026","02/11/2026"],[3,"23/10/2026","11/11/2026"],[1,"01/11/2026","20/11/2026"],[2,"10/11/2026","29/11/2026"],[3,"19/11/2026","08/12/2026"],[1,"28/11/2026","17/12/2026"],[2,"07/12/2026","26/12/2026"],[3,"16/12/2026","04/01/2027"],[1,"25/12/2026","13/01/2027"],[2,"03/01/2027","22/01/2027"],[3,"12/01/2027","31/01/2027"],[1,"21/01/2027","09/02/2027"],[2,"30/01/2027","18/02/2027"],[3,"08/02/2027","27/02/2027"],[1,"17/02/2027","08/03/2027"],[2,"26/02/2027","17/03/2027"],[3,"07/03/2027","26/03/2027"],[1,"16/03/2027","04/04/2027"],[2,"25/03/2027","13/04/2027"],[3,"03/04/2027","22/04/2027"],[1,"12/04/2027","01/05/2027"],[2,"21/04/2027","10/05/2027"],[3,"30/04/2027","19/05/2027"],[1,"09/05/2027","28/05/2027"],[2,"18/05/2027","06/06/2027"],[3,"27/05/2027","15/06/2027"],[1,"05/06/2027","24/06/2027"],[2,"14/06/2027","03/07/2027"],[3,"23/06/2027","12/07/2027"],[1,"02/07/2027","21/07/2027"],[2,"11/07/2027","30/07/2027"],[3,"20/07/2027","08/08/2027"],[1,"29/07/2027","17/08/2027"],[2,"07/08/2027","26/08/2027"],[3,"16/08/2027","04/09/2027"],[1,"25/08/2027","13/09/2027"],[2,"03/09/2027","22/09/2027"],[3,"12/09/2027","01/10/2027"],[1,"21/09/2027","10/10/2027"],[2,"30/09/2027","19/10/2027"],[3,"09/10/2027","28/10/2027"],[1,"18/10/2027","06/11/2027"]];
const DN=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MN=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const REST=7,KEY='trips.v1',HK='trips.hist',SK='trips.sel';
const $=s=>document.querySelector(s);
const P=s=>{const[a,b,c]=s.split('/').map(Number);return Date.UTC(c,b-1,a)/864e5};
const D=n=>new Date(n*864e5);
const iso=n=>D(n).toISOString().slice(0,10);
const fromIso=s=>{const[c,b,a]=s.split('-').map(Number);return Date.UTC(c,b-1,a)/864e5};
const f2=n=>{const x=D(n);return String(x.getUTCDate()).padStart(2,'0')+'/'+String(x.getUTCMonth()+1).padStart(2,'0')+'/'+x.getUTCFullYear()};
const fs=n=>{const x=D(n);return x.getUTCDate()+' '+MN[x.getUTCMonth()]};
const dn=n=>DN[D(n).getUTCDay()];
const now=new Date(),TODAY=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/864e5;
const mk=n=>{const x=D(n);return x.getUTCFullYear()*12+x.getUTCMonth()};
let incl=false,rows=[],hist=[],trip=1,view='rep',cur=null,flt='all',editId=0,sh={scope:'me',from:iso(TODAY),dir:1,n:1};
function reset(){rows=BASE.map((r,i)=>({id:i+1,t:r[0],d:P(r[1]),r:P(r[2])}))}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s)&&s.length)rows=s}catch(e){}
 if(!rows.length)reset();try{hist=JSON.parse(localStorage.getItem(HK))||[]}catch(e){hist=[]}
 trip=+(localStorage.getItem(SK)||1)||1}
function save(){try{localStorage.setItem(KEY,JSON.stringify(rows));localStorage.setItem(HK,JSON.stringify(hist));localStorage.setItem(SK,trip)}catch(e){}}
function snap(){hist.push(JSON.stringify(rows));if(hist.length>20)hist.shift()}
function toast(m){$('#toast').innerHTML='<span>'+m+'</span>';setTimeout(()=>$('#toast').innerHTML='',2600)}

function info(t){const rs=rows.filter(x=>x.t===t).sort((a,b)=>a.d-b.d),ev={},rest=[];
 rs.forEach((x,i)=>{ev[x.d]='dep';ev[x.r]='ret';const nx=rs[i+1],end=nx?nx.d-1:x.r+REST;if(end>x.r)rest.push([x.r+1,end,!nx])});
 return{rs,ev,rest,from:rs.length?rs[0].d:0,to:rs.length?rs[rs.length-1].r+REST:-1}}
function mrep(t,k){const I=info(t),y=Math.floor(k/12),m=k%12,first=Date.UTC(y,m,1)/864e5,n=new Date(Date.UTC(y,m+1,0)).getUTCDate(),days=[];let r=0,c=0,ms=[];
 for(let i=0;i<n;i++){const d=first+i;let q='na';
  if(d>=I.from&&d<=I.to){c++;if(I.ev[d]){q='mis';ms.push({d,k:I.ev[d]})}else if(I.rest.some(x=>d>=x[0]&&d<=x[1])){q='rest';r++}else q='work'}
  days.push({d,q,i:i+1})}
 const rg=I.rest.map(x=>[Math.max(x[0],first),Math.min(x[1],first+n-1),x]).filter(x=>x[0]<=x[1]);
 return{n,c,days,rest:r,work:c-r,mis:ms.length,ms,rg,first,last:first+n-1}}
function mlist(t){const I=info(t),a=[];if(!I.rs.length)return a;for(let k=mk(I.from);k<=mk(I.to);k++)a.push(k);return a}

function rtext(R,k){let t=`**مأموريات شهر ${MN[k%12]}**\n\n`+(R.ms.map(e=>`يوم ${D(e.d).getUTCDate()}  مأمورية  (من ${e.k==='dep'?'القاهرة العوينات':'العوينات القاهرة'})`).join('\n')||'لا توجد مأموريات');
 if(incl)t+=`\n\nعدد أيام الراحة لهذا الشهر هي ${R.rest} أيام و حضور ${R.work} يوم و ${R.mis} مأموريات\nحيث المأموريات تعتبر حضور`;return t}
function copyTxt(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);
 return new Promise((ok,no)=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')?ok():no()}catch(e){no()}a.remove()})}
function vRep(){const L=mlist(trip);if(!L.length)return'<div class="card">لا توجد بيانات لهذه الرحلة.</div>';
 if(cur!=='tot'&&!L.includes(cur))cur=L.includes(mk(TODAY))?mk(TODAY):L[0];
 const tabs='<div class="row sm">'+L.map(k=>`<button class="chip" aria-pressed="${cur===k}" data-k="${k}">${MN[k%12]} ${String(Math.floor(k/12)).slice(2)}</button>`).join('')+`<button class="chip" aria-pressed="${cur==='tot'}" data-k="tot">الإجمالي</button></div>`;
 if(cur==='tot'){let a=0,b=0,c=0,t=0;
  const tr=L.map(k=>{const R=mrep(trip,k);a+=R.rest;b+=R.work;c+=R.mis;t+=R.c;return`<tr><td>${MN[k%12]} ${Math.floor(k/12)}</td><td>${R.rest}</td><td>${R.work}</td><td>${R.mis}</td><td>${R.c}</td></tr>`}).join('');
  return tabs+`<div class="card"><h2>رحلة ${trip} — الإجمالي</h2><div class="tw"><table><thead><tr><th>الشهر</th><th>راحة</th><th>حضور</th><th>مأموريات</th><th>أيام مجدولة</th></tr></thead><tbody>${tr}</tbody><tfoot><tr><td>المجموع</td><td>${a}</td><td>${b}</td><td>${c}</td><td>${t}</td></tr></tfoot></table></div><p class="sum">المأموريات محسوبة ضمن الحضور. الأيام غير المجدولة (قبل أول ذهاب أو بعد آخر راحة) لا تُحسب.</p></div>`}
 const R=mrep(trip,cur),T=`${MN[cur%12]} ${Math.floor(cur/12)}`;
 const ml=R.ms.map(e=>{const dep=e.k==='dep';return`<div class="item"><div><b>يوم ${D(e.d).getUTCDate()}</b> — ${dn(e.d)}<div class="small">مأمورية (من ${dep?'القاهرة إلى العوينات':'العوينات إلى القاهرة'})</div></div><span class="tag ${dep?'t-dep':'t-ret'}">${dep?'ذهاب':'عودة'}</span></div>`}).join('')||'<p class="small">لا توجد مأموريات</p>';
 const rl=R.rg.map(([a,b,x])=>{const cut=x[0]<a||x[1]>b;return`<div class="item"><div><b>من ${fs(a)} إلى ${fs(b)}</b><div class="small">${b-a+1} يوم${cut?` (الراحة كاملة ${x[1]-x[0]+1} يوم: ${fs(x[0])} – ${fs(x[1])})`:''}</div></div><span class="small">${x[1]<=R.last&&!x[2]?'العودة للعمل '+fs(x[1]+1):''}</span></div>`}).join('')||'<p class="small">لا توجد أيام راحة</p>';
 const cal=DN.map(d=>`<div class="h">${d.slice(2)}</div>`).join('')+'<div></div>'.repeat(D(R.first).getUTCDay())+R.days.map(x=>`<div class="c-${x.q}">${x.i}</div>`).join('');
 return tabs+`<div class="card"><h2>رحلة ${trip} — ${T}</h2><div class="stats"><div class="stat s-rest"><b>${R.rest}</b><span>أيام الراحة</span></div><div class="stat s-work"><b>${R.work}</b><span>أيام الحضور</span></div><div class="stat s-mis"><b>${R.mis}</b><span>مأموريات</span></div></div>
 <p class="sum">عدد أيام الراحة لهذا الشهر ${R.rest} أيام وحضور ${R.work} يوم و${R.mis} مأموريات، حيث المأموريات تعتبر حضور. (${R.rest} + ${R.work} = ${R.c} يوم${R.c<R.n?` من ${R.n}؛ ${R.n-R.c} يوم خارج الجدول`:''})</p></div>
 <div class="card"><h2>تقرير للإرسال</h2><pre id="rp" style="white-space:pre-wrap;font:inherit;background:var(--bg);border-radius:8px;padding:10px;line-height:1.9">${rtext(R,cur)}</pre>
 <div class="acts"><button class="btn" id="cp">نسخ التقرير</button><button class="btn o" id="shr">مشاركة</button><button class="chip" data-inc="1" aria-pressed="${incl}">إضافة ملخص الراحة والحضور</button></div></div>
 <div class="card"><h2>المأموريات</h2>${ml}</div><div class="card"><h2>فترات الراحة</h2>${rl}</div>
 <div class="card"><h2>تقويم الشهر</h2><div class="cal">${cal}</div><div class="legend"><span><i style="background:var(--work)"></i>حضور</span><span><i style="background:var(--mis)"></i>مأمورية</span><span><i style="background:var(--rest)"></i>راحة</span><span><i style="background:var(--na)"></i>غير مجدول</span></div></div>`}

function vTbl(){const l=rows.filter(x=>flt==='all'||x.t===+flt).sort((a,b)=>a.d-b.d||a.t-b.t);
 return`<div class="row sm">${['all',1,2,3].map(f=>`<button class="chip" aria-pressed="${flt==f}" data-f="${f}">${f==='all'?'الكل':'رحلة '+f}</button>`).join('')}</div>
 <div class="card"><div class="tw"><table><thead><tr><th>الرحلة</th><th>الذهاب</th><th>اليوم</th><th>العودة</th><th>اليوم</th><th></th></tr></thead><tbody>${l.map(x=>`<tr class="${TODAY>=x.d&&TODAY<=x.r?'now':''}"><td><span class="badge b${x.t}">${x.t}</span></td><td>${f2(x.d)}</td><td>${dn(x.d)}</td><td>${f2(x.r)}</td><td>${dn(x.r)}</td><td><button class="chip" data-e="${x.id}" aria-label="تعديل">✎</button></td></tr>`).join('')}</tbody></table></div>
 <div class="acts"><button class="btn" data-e="0">إضافة رحلة</button></div><p class="sum">${l.length} رحلة. الصف المظلل هو الرحلة الجارية اليوم.</p></div>`}

function vTrip(){const I=info(trip);if(!I.rs.length)return'<div class="card">لا توجد بيانات.</div>';
 const up=I.rs.find(x=>x.r>=TODAY),len=I.rs.reduce((s,x)=>s+x.r-x.d+1,0);
 const cards=I.rs.map((x,i)=>{const nx=I.rs[i+1],re=nx?nx.d-1:x.r+REST,cu=TODAY>=x.d&&TODAY<=re;
  return`<div class="card" ${cu?'style="border-color:var(--acc);border-width:2px"':''}><div class="item"><b>الدورة ${i+1}${cu?' — الجارية الآن':''}</b><button class="chip" data-e="${x.id}">تعديل ✎</button></div>
  <div class="item"><span>الذهاب (قاهرة ← عوينات)</span><b>${f2(x.d)} — ${dn(x.d)}</b></div>
  <div class="item"><span>العودة (عوينات ← قاهرة)</span><b>${f2(x.r)} — ${dn(x.r)}</b></div>
  <div class="item"><span>مدة الدورة</span><b>${x.r-x.d+1} يوم</b></div>
  <div class="item"><span>الراحة</span><b>${re>x.r?`${fs(x.r+1)} – ${fs(re)} (${re-x.r} يوم)`:'—'}</b></div>
  <div class="item"><span>الذهاب التالي</span><b>${nx?f2(nx.d)+' — '+dn(nx.d):'غير مجدول'}</b></div></div>`}).join('');
 return`<div class="card"><h2>بيانات رحلة ${trip}</h2><div class="stats"><div class="stat s-work"><b>${I.rs.length}</b><span>دورات</span></div><div class="stat s-mis"><b>${I.rs.length*2}</b><span>مأموريات</span></div><div class="stat s-rest"><b>${len}</b><span>أيام داخل الدورات</span></div></div>
 <p class="sum">من ${f2(I.from)} إلى ${f2(I.to)}${up?` — القادمة/الجارية: ذهاب ${f2(up.d)} وعودة ${f2(up.r)}`:''}</p>
 <div class="acts"><button class="btn o" id="ext">إضافة دورة تالية بنفس النمط</button></div></div>${cards}`}

function plan(){const from=fromIso(sh.from),n=sh.dir*sh.n;
 return rows.filter(x=>sh.scope==='all'||x.t===trip).map(x=>({x,d:x.d>=from?x.d+n:x.d,r:x.r>=from?x.r+n:x.r})).filter(p=>p.d!==p.x.d||p.r!==p.x.r)}
function vShift(){const p=plan(),bad=p.some(q=>q.r<q.d);
 return`<div class="card"><h2>ترحيل الجدول</h2><p class="small">كل تاريخ ذهاب أو عودة يقع في اليوم المحدد أو بعده يُرحَّل بعدد الأيام المطلوب. التواريخ السابقة تبقى كما هي.</p>
 <div class="f" style="margin-top:10px"><label class="w">النطاق<select id="s-sc"><option value="me" ${sh.scope==='me'?'selected':''}>رحلة ${trip} فقط</option><option value="all" ${sh.scope==='all'?'selected':''}>كل الرحلات</option></select></label>
 <label>من تاريخ (يوم التعديل)<input type="date" id="s-fr" value="${sh.from}"></label><label>عدد الأيام<input type="number" id="s-n" min="1" max="365" value="${sh.n}"></label>
 <label class="w">الاتجاه<select id="s-dr"><option value="1" ${sh.dir===1?'selected':''}>تأخير (ترحيل للأمام)</option><option value="-1" ${sh.dir===-1?'selected':''}>تقديم (ترحيل للخلف)</option></select></label></div>
 <h2 style="margin-top:14px">معاينة (${p.length} تعديل)</h2>${p.map(q=>`<div class="item"><span><span class="badge b${q.x.t}">${q.x.t}</span> ${f2(q.x.d)} ← ${f2(q.x.r)}</span><b ${q.r<q.d?'class="bad"':''}>${f2(q.d)} ← ${f2(q.r)}</b></div>`).join('')||'<p class="small">لا تغيير بهذه الإعدادات.</p>'}
 ${bad?'<p class="bad small">تعديل يجعل العودة قبل الذهاب؛ غيّر الإعدادات.</p>':''}
 <div class="acts"><button class="btn" id="apply" ${p.length&&!bad?'':'disabled'}>تطبيق الترحيل</button><button class="btn o" id="undo" ${hist.length?'':'disabled'}>تراجع (${hist.length})</button></div></div>
 <div class="card"><h2>النسخ الاحتياطي</h2><div class="acts" style="margin-top:0"><button class="btn o" id="exp">تصدير نسخة</button><button class="btn o" id="impb">استيراد نسخة</button><button class="btn d" id="rst">استرجاع الجدول الأصلي</button></div>
 <details><summary>فحص التثبيت</summary><div class="acts"><button class="btn o" id="dg">افحص الآن</button></div><pre id="dgo" style="white-space:pre-wrap;font:inherit;line-height:1.9"></pre></details>
 <details><summary>طريقة التثبيت</summary><p>كمبيوتر (Chrome/Edge): زر «تثبيت التطبيق» أو أيقونة التثبيت في شريط العنوان. ماك (Safari): ملف ← إضافة إلى Dock. آيفون: مشاركة ← إضافة إلى الشاشة الرئيسية. أندرويد: القائمة ← تثبيت التطبيق. يعمل بعدها بدون إنترنت.</p></details></div>`}

async function diag(){const L=[],ok=(c,t)=>L.push((c?'✅ ':'❌ ')+t);
 ok(window.isSecureContext,'اتصال آمن: '+location.protocol+'//'+(location.hostname||'ملف محلي'));
 if(location.protocol==='file:')L.push('⚠️ الملف مفتوح مباشرة من الجهاز والتثبيت لا يعمل هكذا. ارفعه على رابط https أو شغّل ملف start-windows.bat / start-mac-linux.sh');
 ok('serviceWorker' in navigator,'المتصفح يدعم العمل بدون إنترنت');
 try{ok(!!await navigator.serviceWorker.getRegistration(),'تسجيل sw.js');ok(!!navigator.serviceWorker.controller,'sw.js يتحكم بالصفحة (أعد فتح الصفحة مرة إن ظهرت ❌)')}catch(e){ok(false,'sw.js')}
 try{const m=await fetch('manifest.webmanifest'),j=await m.json();ok(m.ok,'manifest: '+j.name)}catch(e){ok(false,'تعذر قراءة manifest.webmanifest')}
 try{ok((await fetch('icons/icon-512.png')).ok,'الأيقونة 512')}catch(e){ok(false,'الأيقونة 512')}
 ok(!!dip,'المتصفح جاهز لعرض التثبيت (لا يظهر إن كان مثبتاً من قبل)');ok(matchMedia('(display-mode: standalone)').matches,'يعمل الآن كتطبيق مثبّت');
 return L.join('\n')}
function render(){
 $('#trips').innerHTML=[1,2,3].map(t=>`<button class="chip" aria-pressed="${t===trip}" data-t="${t}">رحلة ${t}</button>`).join('');
 $('#nav').innerHTML=[['rep','التقارير'],['trip','بيانات الرحلة'],['tbl','الجدول'],['shift','ترحيل']].map(([k,n])=>`<button class="chip" aria-pressed="${view===k}" data-v="${k}">${n}</button>`).join('');
 $('#out').innerHTML={rep:vRep,trip:vTrip,tbl:vTbl,shift:vShift}[view]()}

function openEdit(id){editId=id;const x=rows.find(r=>r.id===id)||{t:trip,d:TODAY,r:TODAY+19};
 $('#dt').textContent=id?'تعديل رحلة':'إضافة رحلة';$('#et').value=x.t;$('#ed').value=iso(x.d);$('#er').value=iso(x.r);$('#eerr').textContent='';$('#edel').hidden=!id;$('#dlg').showModal()}
$('#ecancel').onclick=()=>$('#dlg').close();
$('#esave').onclick=()=>{const t=+$('#et').value,d=fromIso($('#ed').value||'x-0-0'),r=fromIso($('#er').value||'x-0-0');
 if(!(d>0&&r>0)||r<d){$('#eerr').textContent='تاريخ العودة يجب أن يكون بعد الذهاب.';return}
 snap();if(editId){Object.assign(rows.find(x=>x.id===editId),{t,d,r})}else rows.push({id:Math.max(0,...rows.map(x=>x.id))+1,t,d,r});
 save();$('#dlg').close();render();toast('تم الحفظ')};
$('#edel').onclick=()=>{if(confirm('حذف هذه الرحلة؟')){snap();rows=rows.filter(x=>x.id!==editId);save();$('#dlg').close();render()}};

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.t){trip=+d.t;save();render()}else if(d.v){view=d.v;render()}else if(d.k){cur=d.k==='tot'?'tot':+d.k;render()}else if(d.f){flt=d.f;render()}else if(d.inc){incl=!incl;render()}else if(d.e!==undefined)openEdit(+d.e);
 else if(b.id==='apply'){const p=plan();snap();p.forEach(q=>{q.x.d=q.d;q.x.r=q.r});save();render();toast('تم ترحيل '+p.length+' رحلة')}
 else if(b.id==='undo'){rows=JSON.parse(hist.pop());save();render();toast('تم التراجع')}
 else if(b.id==='ext'){const I=info(trip),l=I.rs[I.rs.length-1],nd=l.r+REST+1;snap();rows.push({id:Math.max(0,...rows.map(x=>x.id))+1,t:trip,d:nd,r:nd+(l.r-l.d)});save();render();toast('أضيفت دورة جديدة')}
 else if(b.id==='rst'){if(confirm('سيتم مسح كل التعديلات واسترجاع الجدول الأصلي. متأكد؟')){snap();reset();save();render()}}
 else if(b.id==='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rows)],{type:'application/json'}));a.download='trips-backup.json';a.click()}
 else if(b.id==='cp'){copyTxt($('#rp').textContent).then(()=>toast('تم نسخ التقرير'),()=>toast('تعذر النسخ، حدد النص يدوياً'))}
 else if(b.id==='shr'){const t=$('#rp').textContent;if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
 else if(b.id==='dg'){diag().then(t=>$('#dgo').textContent=t)}
 else if(b.id==='impb')$('#imp').click()});
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const s=JSON.parse(t);if(!Array.isArray(s)||!s.every(x=>x.t&&x.d&&x.r))throw 0;snap();rows=s;save();render();toast('تم الاستيراد')}catch(_){toast('ملف غير صالح')}})};
document.addEventListener('change',e=>{const i=e.target.id;if(!i||i[0]!=='s'||i[1]!=='-')return;
 sh.scope=$('#s-sc').value;sh.from=$('#s-fr').value||sh.from;sh.n=Math.max(1,+$('#s-n').value||1);sh.dir=+$('#s-dr').value;render()});

let dip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#inst').hidden=false});
addEventListener('appinstalled',()=>$('#inst').hidden=true);
$('#inst').onclick=()=>{if(dip){dip.prompt();dip=null;$('#inst').hidden=true}};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
load();render();
</script>
</body>
